; PlatformIO build for the UGS Mesh firmware.
;   pio run -e sensor_node -t upload
;   pio run -e root_node   -t upload
;   pio device monitor -b 115200
;
; Arduino IDE users: ignore this file, open firmware/sensor_node/sensor_node.ino
; (Board: "LOLIN C3 Mini" or "ESP32C3 Dev Module"), install the three libraries
; from Library Manager. See docs/painlessmesh-guide.md.

[env]
platform = espressif32
framework = arduino
board = lolin_c3_mini            ; use esp32-c3-devkitm-1 if not a LOLIN/WEMOS C3 Mini
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
    painlessmesh/painlessMesh @ ^1.5.6
    bblanchon/ArduinoJson @ ^7.2.0
    arkhipenko/TaskScheduler @ ^3.8.5
    ; If the mesh fails to build/connect on the C3, pin a maintained AsyncTCP fork:
    ; mathieucarbou/AsyncTCP @ ^3.2.5

[env:sensor_node]
build_src_filter = +<../sensor_node/>

[env:root_node]
build_src_filter = +<../root_node/>
