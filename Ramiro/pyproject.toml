[project]
name = "ugs-mesh"
version = "0.1.0"
description = "UGS Mesh — Pi-side gateway, fusion, alerting, dashboard, simulator"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*.md", ".venv", "data"]

[tool.ruff.lint]
# ruff format handles line length; E501 only nags docstrings/URLs here
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
